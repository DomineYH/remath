# 서버 컨테이너의 유일한 정의 (#35 A-4, H-29 5단계). 손으로 docker run 하지 않는다.
# scripts/deploy.sh 5단계가 env 교체 뒤 `docker compose -f deploy/compose.yaml up -d --force-recreate` 로 매번 다시 만든다.
#
# 배포는 일부러 아래 image 태그에서 컨테이너를 다시 만든다(지금 도는 컨테이너의 이미지 id 가 아니다).
# 새 코드를 내려면 먼저 그 태그를 갱신한다: `docker build -t remath:latest .` 또는 REMATH_IMAGE=<태그>.
# 같은 코드로 재배포하려면 태그를 그대로 둔다.
#
# 변수(셸 env 에서 읽는다): REMATH_ENV_FILE(필수, 절대 경로), REMATH_IMAGE, REMATH_BIND, REMATH_PORT, REMATH_BACKUP_DIR.
name: remath
services:
  server:
    image: ${REMATH_IMAGE:-remath:latest}
    container_name: remath
    restart: unless-stopped
    # 서버 런타임 env(MOCK_LLM, COOKIE_SECURE, SUPABASE_* …). deploy.sh 는 스모크 통과 뒤 SUPABASE_* 4줄만 바꾼다.
    # 컨테이너는 3000 에서 듣는다: 이 파일에 PORT 를 넣지 않는다.
    env_file: ${REMATH_ENV_FILE:?set REMATH_ENV_FILE to the absolute path of the server runtime env file}
    user: node
    ports:
      # 기본은 이 호스트에서만 열린다(앞단 리버스 프록시가 HTTPS 종단). 모든 인터페이스에 열려면 REMATH_BIND=0.0.0.0.
      - "${REMATH_BIND:-127.0.0.1}:${REMATH_PORT:-3000}:3000"
    volumes:
      # #47 SQLite 백업 자리(BACKUP_DIR 기본 backup/, 컨테이너 작업 디렉터리 /app/server 기준).
      # 호스트 디렉터리는 컨테이너 사용자 node(uid 1000)가 쓸 수 있어야 한다. 상대 경로는 이 파일의 위치 기준.
      - "${REMATH_BACKUP_DIR:-../backup}:/app/server/backup"
